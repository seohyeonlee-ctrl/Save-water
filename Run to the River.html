<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run to the River</title>
<style>
:root{--bg:#f6efe0;--fg:#3a2f1c;--mut:#7a6a4d;--card:#fff;--ac:#2196f3;--line:#e0d3b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1710;--fg:#f1e8d5;--mut:#b3a584;--card:#2a2317;--line:#463b27}}
:root[data-theme="dark"]{--bg:#1c1710;--fg:#f1e8d5;--mut:#b3a584;--card:#2a2317;--line:#463b27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:720px;padding:16px;text-align:center}
h1{font-size:20px;margin:4px 0}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.tl{font-size:14px;font-weight:700;display:flex;justify-content:space-between;margin-top:8px}
.tb{height:18px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.tb i{display:block;height:100%;width:100%;background:#2196f3;transition:background .3s}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);touch-action:none}
.msg{min-height:44px;font-size:15px;color:var(--mut);margin:8px 0}
.two{display:flex;gap:8px}
button{flex:1;font:inherit;font-size:22px;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
#wbox{display:none;gap:8px;margin-top:8px}#wbox input{flex:1;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}#wbox button{flex:0 0 90px;background:#43a047}
</style>
</head>
<body>
<main>
<h1>🏜️ Run to the River</h1>
<div class="top"><span id="st">Stage 1</span><span id="ds">0 / 0 m</span><span id="bs2">Best: Stage 1</span></div>
<div class="tl"><span>💧 Thirst</span><span id="tn">100</span></div>
<div class="tb"><i id="tf"></i></div>
<canvas id="c" width="700" height="300" aria-label="Behind-the-back runner game"></canvas>
<div id="wbox"><input id="wi" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type an English word..."><button id="wsend">Send</button></div>
<div class="msg" id="ms"></div>
<div class="two"><button id="bl">◀ Left</button><button id="br">Right ▶</button></div>
<div class="two" style="margin-top:8px"><button id="bg" style="background:#2e9e5b">▲ Run (W)</button><button id="bs" style="background:#e53935">■ Stop (Space)</button></div>
</main>
